[project]
name = "bioinfo-agent"
version = "0.1.0"
description = "Answer questions about a differential expression analysis with an LLM agent"
authors = [
    { name = "hut-ml", email = "thomashu2.fr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "pydantic-ai-slim[openai]>=2.71.0",
    "pydeseq2>=0.6.0",
    "python-dotenv>=1.2.4",
    "typer>=0.29.2",
]

[project.scripts]
bioinfo-agent = "bioinfo_agent.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
